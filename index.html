<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center px-6 py-5">
    <!-- Main Container -->
      <div class="w-full max-w-[395px] bg-white rounded-md shadow-[0_3px_12px_rgba(0,0,0,0.12)] px-6 py-6">
         <!-- GitHub Logo -->
        <div class="text-center">
            <div class="w-[75px] h-[75px] mx-auto">
                <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-full h-full object-contain" />
            </div>

            <h1 class="text-[19px] font-bold text-[#24292f] mt-3">
                GitHub Issues Tracker
            </h1>

            <p class="text-[13px] text-[#64748b] mt-1">
                Sign in to manage your issues
            </p>
        </div>
      </div>
    
</body>
</html>
