<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center px-6 py-5">
    <!-- Main Container -->
      <div class="w-full max-w-[395px] bg-white rounded-md shadow-[0_3px_12px_rgba(0,0,0,0.12)] px-6 py-6">
         <!-- GitHub Logo -->
        <div class="text-center">
            <div class="w-[75px] h-[75px] mx-auto">
                <img src="./assets/github-logo.png" alt="GitHub Logo" class="w-full h-full object-contain" />
            </div>

            <h1 class="text-[19px] font-bold text-[#24292f] mt-3">
                GitHub Issues Tracker
            </h1>

            <p class="text-[13px] text-[#64748b] mt-1">
                Sign in to manage your issues
            </p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="mt-5">
            <!-- Username -->
            <div class="mb-3">
                <label for="username" class="block text-[13px] text-[#111827] mb-1.5">
                    Username
                </label>

                <input type="text" id="username" name="username" placeholder="Enter Username" autocomplete="username"
                    required
                    class="w-full h-[37px] border border-[#d9dce1] rounded-md px-3 text-[12px] text-[#334155] outline-none focus:border-[#4f46e5]" />
            </div>

             <!-- Password -->
            <div>
                <label for="password" class="block text-[13px] text-[#111827] mb-1.5">
                    Password
                </label>

                <input type="password" id="password" name="password" placeholder="Enter Password"
                    autocomplete="current-password" required
                    class="w-full h-[37px] border border-[#d9dce1] rounded-md px-3 text-[12px] text-[#334155] outline-none focus:border-[#4f46e5]" />
            </div>

            <!-- Sign In Button -->
            <button type="submit"
                class="w-full h-[37px] mt-4 rounded-md bg-[#4b00ff] hover:bg-[#3d00d6] text-white text-[12px] font-semibold transition duration-200">
                Sign In
            </button>
            <div class="p-2 text-red-500 font-semibold capitalize">
                <p id="loginError"></p>
            </div>
        </form>

        <!-- OR Section -->
        <div class="flex items-center gap-2 mt-5">
            <div class="h-[1px] bg-[#e5e7eb] flex-1"></div>

            <span class="text-[12px] text-[#374151]"> OR </span>

            <div class="h-[1px] bg-[#e5e7eb] flex-1"></div>
        </div>

        <!-- Demo Credentials -->
        <div class="mt-5">
            <p class="text-center text-[11px] text-[#64748b] mb-2">
                Demo Credentials:
            </p>

            <div class="bg-[#f8fafc] rounded-md py-5 text-center text-[12px] text-[#1f2937]">
                <p>
                    <span class="font-bold">Username:</span>
                    admin
                </p>

                <p>
                    <span class="font-bold">Password:</span>
                    admin123
                </p>
            </div>
        </div>
      </div>
    
</body>
</html>
