<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f8fafc;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #1e293b;
        }

        button,
        input {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .issue-card {
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                border-color 0.15s ease;
        }

        .issue-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .issue-card:focus-visible {
            outline: 3px solid rgba(79, 70, 229, 0.25);
            outline-offset: 2px;
        }

        .tab-button {
            transition:
                background-color 0.15s ease,
                color 0.15s ease;
        }

        #modalBackdrop {
            animation: fadeIn 0.15s ease;
        }

        #issueModal {
            animation: modalIn 0.18s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid #e2e8f0;
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 699px) {
            .desktop-only {
                display: none !important;
            }
        }
    </style>

</head>
<body>
    
    <!-- NAVBAR -->

    <header id="navbar" class="sticky top-0 z-40 border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8">

            <!-- Logo -->

            <a href="./issues.html" class="flex shrink-0 items-center gap-2" aria-label="GitHub Issues Tracker Home">
                <img src="./assets/github-logo.png" alt="GitHub" class="h-8 w-8 object-contain">

                <div class="hidden sm:block">
                    <p class="text-xl font-bold text-slate-800">
                        GitHub Issues Tracker
                    </p>
                </div>
            </a>

            <!-- Navigation Actions -->

            <div id="navActions" class="flex min-w-0 flex-1 items-center justify-end gap-2">

                <!-- Search -->

                <div class="flex min-w-0 flex-1 sm:max-w-md">

                    <label for="searchInput" class="sr-only">
                        Search issues
                    </label>

                    <div class="absolute flex-1 sm:flex-none">
                        <span class="pointer-events-none left-3 absolute top-4 -translate-y-1/2 text-slate-400"> <svg
                                width="17" height="17" viewBox="0 0 24 24" fill="none">
                                <path d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                            </svg> </span>
                    </div>

                    <input id="searchInput" type="search" placeholder="      Search issues..." autocomplete="off" class="min-w-0 flex-1 rounded-l-lg border border-r-0 border-slate-300 bg-white 
                        px-3 py-2 text-xs text-slate-700 outline-none transition focus:border-indigo-500 
                        focus:ring-2 focus:ring-indigo-100">

                    <button id="searchButton" type="button"
                        class="rounded-r-lg bg-indigo-600 px-3 py-2 text-xs font-semibold text-white transition hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-300">
                        Search
                    </button>
                </div>

                <!-- New Issue -->

                <button id="newIssueButton" type="button"
                    class="hidden shrink-0 items-center gap-1.5 rounded-lg bg-indigo-600 px-3 py-2 text-xs font-semibold text-white transition hover:bg-indigo-700 sm:flex">
                    <span class="text-base leading-none">+</span>
                    New Issue
                </button>

            </div>

        </div>

    </header>

     <!-- MAIN -->

    <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">

        <!-- Page Heading -->

        <section class="mb-5 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">

            <div>
                <div class="mb-1 flex items-center gap-2">
                    <img src="./assets/Aperture.png" alt="">
                    <h1 class="text-xl font-bold text-slate-800 sm:text-2xl">
                        Issues
                    </h1>
                </div>

                <p id="sectionSubtitle" class="text-xs text-slate-500">
                    Track and manage your project issues
                </p>

            </div>

            <!-- Legend -->

            <div class="flex items-center gap-4 text-xs text-slate-500">

                <div class="flex items-center gap-1.5">
                    <span class="h-2 w-2 rounded-full bg-green-500"></span>

                    <span>Open</span>
                </div>

                <div class="flex items-center gap-1.5">
                    <span class="h-2 w-2 rounded-full bg-violet-500"></span>

                    <span>Closed</span>
                </div>

            </div>

        </section>

        <!-- TABS -->

        <section class="mb-5 flex flex-wrap items-center justify-between gap-3">

            <div class="inline-flex rounded-lg border border-slate-200 bg-white p-1 shadow-sm" role="tablist"
                aria-label="Issue status">

                <button type="button" class="tab-button rounded-md px-4 py-2 text-xs font-semibold" data-tab="all"
                    role="tab" aria-selected="true">
                    All
                </button>

                <button type="button" class="tab-button rounded-md px-4 py-2 text-xs font-semibold" data-tab="open"
                    role="tab" aria-selected="false">
                    Open
                </button>

                <button type="button" class="tab-button rounded-md px-4 py-2 text-xs font-semibold" data-tab="closed"
                    role="tab" aria-selected="false">
                    Closed
                </button>

            </div>


            <div id="issueCount" class="text-xs font-semibold text-slate-500">
                0 Issues
            </div>

        </section>

        <!-- LOADING -->

        <div id="loading" class="flex min-h-[240px] items-center justify-center" style="display: none;">
            <div class="flex flex-col items-center gap-3">
                <div class="spinner"></div>

                <p class="text-xs font-medium text-slate-500">
                    Loading issues...
                </p>
            </div>
        </div>

        <!-- ISSUES GRID -->

        <section id="issuesGrid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
            aria-live="polite"></section>

        <!-- EMPTY STATE -->

        <section id="emptyState"
            class="hidden rounded-xl border border-dashed border-slate-300 bg-white px-5 py-16 text-center">

            <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 text-xl">
                🗂️
            </div>

            <h2 class="mb-1 text-sm font-bold text-slate-700">
                No issues found
            </h2>

            <p class="text-xs text-slate-400">
                Try another search or select a different status.
            </p>

        </section>

    </main>
</body>
</html>
